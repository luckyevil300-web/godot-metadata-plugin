name: Build Godot Metadata Plugin

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Baixar godot-lib AAR
        run: |
          mkdir -p libs
          curl -L \
            "https://github.com/godotengine/godot/releases/download/4.3-stable/godot-lib.4.3.stable.template_release.aar" \
            -o libs/godot-lib.release.aar

      - name: Gerar Gradle Wrapper
        run: gradle wrapper --gradle-version 8.5

      - name: Build AAR
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: GodotMetadataPlugin
          path: |
            build/outputs/aar/godot-plugin-release.aar
            GodotMetadataPlugin.gdap
            MetadataPlugin.gd
            exemplo_player.gd
          retention-days: 30
