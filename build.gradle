plugins {
    id 'com.android.library' version '8.2.2' apply true
}

android {
    namespace 'com.musicplayer.godot'
    compileSdk 34

    defaultConfig {
        minSdk 21
        targetSdk 34
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Godot Android library — baixado pelo CI e colocado em libs/
    compileOnly fileTree(dir: 'libs', include: ['*.aar'])

    // JAudioTagger: leitura de metadados ID3 / Vorbis
    implementation 'net.jthink:jaudiotagger:3.0.1'
}
